# Run the review checkpoint where `gh` actually exists.
#
# scripts/loop/rounds.sh is what stops a builder and a reviewer improving each
# other forever — PR #1 reached 33 review rounds before anyone noticed the loop
# had no exit. The script needs `gh`, and the cloud container where the work
# actually happens has no `gh`, so rounds were being counted by hand. That is
# precisely the manual step the script exists to remove, and it is the one that
# gets skipped at 3am.
#
# A GitHub runner has both `gh` and a token. Running it here makes the
# checkpoint structural instead of conscientious.
#
# This never blocks a merge. The checkpoint stops the *builder*; Lawrence merges
# whenever he likes. It labels instead, so the review queue stays greppable:
#   gh pr list --label checkpoint
name: checkpoint

on:
  pull_request_review:
    types: [submitted]
  # A review is not the only thing that changes the answer. Authorising more
  # rounds happens in a PR *comment*, which emits no review event — so without
  # this trigger the label would survive until the next review landed, and a
  # digest reading `--label checkpoint` would keep reporting a PR as awaiting
  # authorisation that had already been authorised.
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: checkpoint-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  checkpoint:
    # Reviews always re-evaluate. Comments only when they carry the continuation
    # marker, and only on a PR — issue_comment also fires on plain issues.
    # rounds.sh stays the authority on what the marker means; a false trigger
    # here just re-runs a read-only evaluation, which is harmless.
    if: >
      github.event_name == 'pull_request_review' ||
      (github.event.issue.pull_request != null &&
       (contains(github.event.comment.body, '@claude continue') ||
        contains(github.event.comment.body, '/continue')))
    runs-on: ubuntu-latest
    # Deliberately not gated on the reviewer's login. rounds.sh already decides
    # whose reviews count; a second copy of that rule here could disagree with it
    # and skip silently, which is the failure mode this workflow exists to remove.
    steps:
      - uses: actions/checkout@v6

      - name: Evaluate the round budget
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set +e
          output="$(bash scripts/loop/rounds.sh "$PR" 2>&1)"; status=$?
          set -e
          echo "$output"

          # Three outcomes, and the third is the one that matters. rounds.sh
          # exits 0 for "budget verified available", 1 for "checkpoint reached",
          # and anything else for "could not determine". Only a *positively
          # verified* result may clear the label: a transient API failure that
          # normalised to zero rounds would otherwise silently release a PR that
          # is genuinely stopped, which is the one direction this must never
          # fail in.
          if [ "$status" -gt 1 ]; then
            echo "::warning::Could not evaluate the round budget for PR #$PR (exit $status). Leaving the checkpoint state untouched."
            exit 0
          fi

          if [ "$status" -eq 0 ]; then
            gh pr edit "$PR" --remove-label checkpoint 2>/dev/null || true
            exit 0
          fi

          # Say it once. Re-running on an already-stalled PR should stay quiet.
          if gh pr view "$PR" --json labels --jq '.labels[].name' | grep -qx checkpoint; then
            echo "Already flagged; not commenting again."
            exit 0
          fi

          gh label create checkpoint \
            --color BFA100 \
            --description "Builder stopped at the round budget; awaiting @claude continue" \
            2>/dev/null || true
          gh pr edit "$PR" --add-label checkpoint
          gh pr comment "$PR" --body-file .github/checkpoint-comment.md
