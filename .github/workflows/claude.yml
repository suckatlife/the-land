# OPTIONAL. You do not need this to work from a phone — claude.ai/code (in the
# Claude app) reaches this repo without it, runs on Anthropic's infrastructure,
# and bills against your subscription rather than an API key. Prefer that.
#
# This file exists for one case: driving Claude from a GitHub comment when you
# would rather not open the Claude app at all. Comment "@claude ..." on an issue
# or PR and a full session runs on GitHub's runners and opens a PR.
#
# Setup, only if you want it:
#   1. Install https://github.com/apps/claude on this repo
#   2. Run `claude setup-token` locally, add the result as repo secret
#      CLAUDE_CODE_OAUTH_TOKEN. That authenticates with the Pro/Max
#      SUBSCRIPTION, so runs do not hit API billing. (ANTHROPIC_API_KEY also
#      works and is billed separately.)
#
# Resuming a checkpointed PR: comment "@claude /continue" — the @claude wakes
# this workflow, the /continue is what scripts/loop/rounds.sh reads as
# authorisation for more rounds. One comment does both.
#
# Without that secret this workflow will fire on an @claude comment and fail,
# leaving a red X. Delete the file if you decide not to use it.
#
# Loop hazard: Claude's PR auto-fix feature posts comments under YOUR GitHub
# account. If such a comment ever contains "@claude", it would re-trigger this
# workflow. The guards below (skip bots, one run at a time) reduce that; if you
# enable auto-fix, watch the Actions tab the first time.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

concurrency:
  # One session at a time, so a chain of comments cannot fan out into
  # overlapping runs racing each other on the same branch.
  group: claude-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    # Only wake up when actually summoned, and never in response to a bot —
    # otherwise every comment burns a run, and an agent's own reply can
    # re-trigger the workflow it came from.
    if: |
      github.event.sender.type != 'Bot' &&
      (contains(github.event.comment.body, '@claude') || contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read       # so Claude can read CI results on the PR
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0     # full history: turns reference earlier commits and tags
      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth. Swap to anthropic_api_key for API billing.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Ceiling on ONE wake-up. Different bound from the review checkpoint:
          # the checkpoint limits how many PUSHES happen, this limits how much
          # work happens inside a single run.
          #
          # 25 was too low and cost a real run: on PR #38 Claude worked for two
          # minutes, posted its checklist, was mid-way through two review
          # findings, and died with error_max_turns having pushed nothing. On a
          # codebase whose main.ts is 8k lines, reading, editing and building
          # spends turns quickly. 80 leaves room to finish an ordinary task; the
          # checkpoint is what actually bounds the loop.
          claude_args: "--max-turns 80"
